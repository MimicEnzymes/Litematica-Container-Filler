plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.3'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    flatDir {
        dirs 'libs'
    }
    maven { url "https://bmclapi2.bangbang93.com/maven" }
    maven { url "https://maven.aliyun.com/repository/public" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://masa.dy.fi/maven/" }
    maven { url "https://masa.dy.fi/maven/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation files("libs/litematica-fabric-${project.litematica_version}.jar")
    implementation files("libs/malilib-fabric-${project.malilib_version}.jar")
    compileOnly files('libs/modmenu-20.0.1.jar')
    runtimeOnly files('libs/modmenu-20.0.1.jar')
    compileOnly files('libs/quickshulker-3.0.2-26.2.jar')
    runtimeOnly files('libs/quickshulker-3.0.2-26.2.jar')
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

processResources {
    exclude '**/*.xcf'
    inputs.property "mod_version", project.mod_version
    filesMatching("fabric.mod.json") {
        expand "mod_version": project.mod_version
    }
}
