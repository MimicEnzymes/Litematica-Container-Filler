plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    flatDir {
        dirs 'libs'
    }
    maven {
        url "https://maven.fallenbreath.me/releases"
        content {
            includeGroup "me.fallenbreath"
        }
    }
    maven {
        url "https://bmclapi2.bangbang93.com/maven"
        content {
            excludeGroup "me.fallenbreath"
        }
    }
    maven {
        url "https://maven.aliyun.com/repository/public"
        content {
            excludeGroup "me.fallenbreath"
        }
    }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://masa.dy.fi/maven/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation name: 'litematica-fabric-1.21.11-0.25.4'
    modImplementation name: 'malilib-fabric-1.21.11-0.27.5'
    modCompileOnly name: 'modmenu-17.0.0-beta.2'
    modLocalRuntime name: 'modmenu-17.0.0-beta.2'
    modCompileOnly name: 'quickshulker-2.10.0-1.21.11'
    modLocalRuntime name: 'quickshulker-2.10.0-1.21.11'
    modLocalRuntime("me.fallenbreath:conditional-mixin-fabric:0.6.4") {
        transitive = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}
