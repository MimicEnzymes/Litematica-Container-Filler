plugins {
    id 'fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    flatDir {
        dirs 'libs'
    }
    maven { url "https://bmclapi2.bangbang93.com/maven" }
    maven { url "https://maven.aliyun.com/repository/public" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://masa.dy.fi/maven/sakura-ryoko/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.fallenbreath.me/releases" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
//    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    modImplementation "fi.dy.masa.malilib:${project.malilib_version}"
    modImplementation "fi.dy.masa.litematica:${project.litematica_version}"
    modImplementation name: 'quickshulker-2.10.0-1.21.11'
}